# =============================================
# tmux.conf — WSL Arch Linux / VPS 通用配置
# 适用：tmux 3.2+
# =============================================

# =============================================
# 1. 终端颜色与 TUI 兼容性
# =============================================

# 向 tmux 内的程序声明 256 色终端类型
set -g default-terminal "tmux-256color"

# 重置为当前 tmux 版本默认特性，避免重复 reload 时不断追加
set -su terminal-features

# Windows Terminal / xterm 系列真彩色
set -as terminal-features ',xterm*:RGB'

# 嵌套 tmux：支持真彩色和 OSC 52 剪贴板传递
set -as terminal-features ',tmux*:RGB:clipboard'

# 保留此前 VPS 的 ESC 时序配置；不是 DA 响应泄漏的根本修复
set -s escape-time 100

# 支持 TUI 焦点事件、扩展组合键（须终端自身支持）
set -s focus-events on
set -s extended-keys on

# =============================================
# 2. 鼠标、剪贴板和 Vim 复制模式
# =============================================

set -g mouse on

# 保留 OSC 52 透传能力；仅适合信任 tmux 内程序的环境
set -s set-clipboard on

setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

set -g history-limit 50000

# Window 和 Pane 编号从 1 开始
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# =============================================
# 3. 状态栏：保留原有 Catppuccin 风格
# =============================================

set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-interval 5

# 左侧：Session 名称
set -g status-left-length 40
set -g status-left "#[fg=#1e1e2e,bg=#89b4fa,bold] 󱫋 #S #[default] "

# 中间：窗口编号和窗口名称
setw -g window-status-format " #[fg=#6c7086]#I:#W "
setw -g window-status-current-format " #[fg=#a6e3a1,bold][#I:#W] "

# 右侧：主机名、日期和本地时间
set -g status-right-length 60
set -g status-right "#[fg=#fab387,bold] 󰒋 #H #[fg=#bac2de]| #[fg=#b4befe]%Y-%m-%d %H:%M "

# =============================================
# 4. 便捷操作
# =============================================

# Prefix (Ctrl+B) + r：重新加载配置
bind-key r source-file ~/.tmux.conf \; display-message "tmux config reloaded"
